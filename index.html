<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chicken Sandy — Sandwich Shift</title>
<!-- The Telegram Mini App SDK, loaded the way Telegram asks: in the head,
     before anything else, so ready(), expand() and requestFullscreen() can run
     the moment the page opens instead of seconds later. Written in only when
     served over http(s): opened straight off the filesystem the game makes no
     network requests at all. -->
<script>
  if (location.protocol !== 'file:') {
    document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
  }
</script>
<style>
  :root{
    --wood:#3f62ad; --wood-dk:#14203d; --wood-md:#23345e; --cream:#fbf3e2;
    --gold:#f2c14e; --red:#c8402e; --red-dk:#8a2a1e; --green:#6cbf4a;
    --ink:#3a2a1e; --paper:#f8eed8; --paper-dk:#e6d5b2;
    --railW:146px;   /* width of the landscape ticket column */
    /* Safe-area insets. Default to the device values; platform.js widens them
       to clear Telegram's own overlay when the mini app runs fullscreen. */
    --sat:env(safe-area-inset-top);    --sar:env(safe-area-inset-right);
    --sab:env(safe-area-inset-bottom); --sal:env(safe-area-inset-left);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#1a1d2e;}
  body{
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    font-weight:700;letter-spacing:.5px;color:var(--cream);
    -webkit-font-smoothing:antialiased;
    /* phone/Telegram hygiene: no rubber-banding, pinch-zoom or text selection */
    position:fixed;inset:0;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
  #app{position:fixed;inset:0;}

  /* ---------- generic HUD panel ---------- */
  .panel{
    background:var(--wood-md);
    border:3px solid var(--wood-dk);
    background:linear-gradient(180deg,#2c4176,#1d2b52);border-color:#c9a04a;border-radius:10px;
    box-shadow:inset 0 0 0 2px #14203d, 0 4px 10px rgba(0,0,0,.35);
    padding:8px 12px;
  }

  /* Inset rather than padded: an absolutely-positioned child resolves against
     its container's padding *edge*, so padding here would not move any of the
     HUD. Shrinking the box itself does, and every child below can then use
     plain offsets and stay clear of notches, home indicators and — when we run
     as a fullscreen Telegram mini app — Telegram's floating close button. */
  #hud{
    position:fixed;pointer-events:none;z-index:10;
    top:var(--sat); right:var(--sar); bottom:var(--sab); left:var(--sal);
  }

  /* ---------- top bar ---------- */
  #topbar{
    position:absolute;top:10px;right:12px;
    display:flex;gap:8px;align-items:stretch;
  }
  .stat{min-width:104px;text-align:center;}
  .stat .k{font-size:9px;color:#e8d9b0;text-transform:uppercase;}
  .stat .v{font-size:20px;color:var(--cream);text-shadow:2px 2px 0 #000;line-height:1.25;}
  .stat .v.gold{color:var(--gold);}
  .stat .v.hot{color:#ff6b4a;}
  #clockwrap .v{letter-spacing:2px;}
  #daywrap .v{font-size:16px;}
  #daywrap .sub{font-size:8px;color:#d9c9a2;margin-top:2px;white-space:nowrap;}
  #clockwrap #realClock{display:block;padding-left:0;font-size:8px;color:#d9c9a2;margin-top:2px;white-space:nowrap;}
  .card h1.tgtitle small{display:block;font-size:.5em;letter-spacing:4px;color:#f0a03a;margin-bottom:4px;}
  .card .timeofday{color:#cfe0ff;font-size:11px;}
  /* target-for-the-day meter under the score */
  .tgt{height:6px;background:#14203d;border:2px solid #14203d;margin-top:4px;}
  .tgt i{display:block;height:100%;background:var(--gold);width:0%;transition:width .3s ease-out;}
  .tgt.done i{background:var(--green);}
  .tgt.xp i{background:#b58cff;}
  #moves .mv.hidden, .tbtn.hidden{display:none;}
  #moves .m.live i{background:#ff9a3c;}
  .tbtn.power{grid-column:1 / span 2;grid-row:3;justify-self:center;width:72px;height:44px;border-radius:22px;
    font-size:10px;background:#7a4fb8;border-color:#3f2668;box-shadow:inset 0 3px 0 #a07ade,0 4px 0 rgba(0,0,0,.45);}
  .tbtn.power.live{background:#e8892a;border-color:#8a4a12;}
  .skillpts{color:#b58cff;}
  #tgtLabel{font-size:8px;color:#d9c9a2;margin-top:3px;}

  /* fryer gauges — so you always know what is in the oil, in any camera mode */
  #fryers{
    position:absolute;right:12px;top:152px;
    display:flex;flex-direction:column;gap:5px;align-items:flex-end;
  }
  #fryers.hidden{display:none;}
  .fry{
    background:var(--wood-md);border:2px solid #c9a04a;border-radius:8px;padding:4px 8px;
    box-shadow:inset 0 2px 0 #3f5a96;min-width:96px;text-align:center;
  }
  .fry .n{font-size:8px;color:#e8d9b0;text-transform:uppercase;}
  .fry .m{height:6px;background:#14203d;margin-top:3px;}
  .fry .m i{display:block;height:100%;width:100%;}
  .fry.idle{opacity:.45;}
  .fry.idle .n{color:#a8a090;}

  /* ---------- tickets ---------- */
  #tickets{
    position:absolute;top:10px;left:12px;right:250px;
    display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;align-items:flex-start;
  }
  .ticket{
    width:196px;background:var(--paper);color:var(--ink);
    border:3px solid #b8862e;border-radius:9px;overflow:hidden;
    box-shadow:0 4px 0 rgba(0,0,0,.4);
    padding:0 0 6px 0;position:relative;overflow:hidden;
    animation:slidein .25s ease-out;
  }
  @keyframes slidein{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}
  .ticket.dying{animation:pop .3s ease-in forwards;}
  @keyframes pop{to{transform:scale(1.12) translateY(-40%);opacity:0}}
  .ticket .thead{
    display:flex;align-items:center;gap:6px;
    background:var(--red);color:#fff6e6;padding:4px 6px;font-size:10px;
    border-bottom:2px solid #b8862e;
  }
  .ticket .face{width:16px;height:16px;border:2px solid #00000055;image-rendering:pixelated;}
  .ticket .tbody{padding:6px 8px 2px 8px;font-size:11px;line-height:1.5;}
  .line{display:flex;align-items:flex-start;gap:5px;}
  .line .bullet{color:#b8862e;}
  .sub{padding-left:12px;font-size:10px;color:#6a5238;display:flex;flex-wrap:wrap;gap:4px 6px;}
  .chip{display:inline-flex;align-items:center;gap:3px;}
  .sw{width:8px;height:8px;border:1px solid #00000066;display:inline-block;}
  .bar{height:7px;background:#e6d5b2;border-top:2px solid #b8862e;margin-top:5px;}
  .bar i{display:block;height:100%;background:var(--green);transition:width .2s linear;}
  .bar.warn i{background:var(--gold);}
  .bar.bad i{background:var(--red);}
  .ticket.urgent{animation:shake .4s infinite;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  /* ---------- held item ---------- */
  /* bottom-left stack: 3D plate inspector sitting on top of the text summary */
  #leftstack{
    position:absolute;left:12px;bottom:12px;
    display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  }
  #plateview{width:148px;height:148px;padding:0;background:transparent;}
  #plateview.hidden{display:none;}
  #held{min-width:190px;max-width:236px;}

  /* dash cooldown + remaining wing flaps */
  #moves{min-width:190px;padding:6px 10px;display:flex;gap:12px;align-items:center;}
  #moves .mv{flex:1;}
  #moves .k{font-size:8px;color:#e8d9b0;text-transform:uppercase;letter-spacing:1px;}
  #moves .m{height:6px;background:#14203d;border:2px solid #14203d;margin-top:3px;}
  #moves .m i{display:block;height:100%;background:var(--gold);width:100%;}
  #moves .m.ready i{background:#6fd8ff;}
  #moves .pips{display:flex;gap:3px;margin-top:4px;}
  #moves .pip{width:12px;height:8px;background:#14203d;border:2px solid #14203d;}
  #moves .pip.on{background:#f3e6d0;}
  #held .k{font-size:9px;color:#e8d9b0;text-transform:uppercase;}
  #held .v{font-size:13px;color:var(--cream);text-shadow:2px 2px 0 #000;margin-top:3px;line-height:1.4;}
  #held .detail{font-size:10px;color:#f0e6cc;margin-top:5px;line-height:1.7;}
  #held .detail .chip{margin-right:6px;white-space:nowrap;}

  /* ---------- hint ---------- */
  #hint{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    font-size:12px;padding:7px 14px;text-align:center;white-space:nowrap;
  }
  #hint .key{
    display:inline-block;background:var(--gold);color:#3a2a1e;border:2px solid #d0841a;
    padding:1px 7px;margin-right:7px;box-shadow:0 2px 0 #d0841a;
  }
  #hint.blocked{color:#c9b78e;}
  #hint.blocked .key{background:#34508f;border-color:#1d2b52;box-shadow:0 2px 0 #1d2b52;color:#d9c9a2;}
  #hint.hidden{display:none;}

  /* ---------- controls / buttons ---------- */
  #btns{position:absolute;right:12px;top:98px;display:flex;gap:6px;pointer-events:auto;}
  .btn{
    background:var(--wood-md);border:3px solid var(--wood-dk);color:var(--cream);
    font:inherit;font-size:10px;padding:6px 9px;cursor:pointer;
    background:linear-gradient(180deg,#2c4176,#1d2b52);border-color:#c9a04a;border-radius:8px;
    box-shadow:inset 0 0 0 2px #14203d, 0 3px 6px rgba(0,0,0,.35);
  }
  .btn:hover{background:#34508f;}
  .btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #14203d;}

  /* ---------- toasts ---------- */
  #toasts{
    position:absolute;top:190px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .toast{
    font-size:13px;padding:6px 14px;background:#14203dee;border:3px solid var(--wood-dk);
    color:var(--cream);text-shadow:2px 2px 0 #000;animation:toastin .3s ease-out, toastout .4s ease-in forwards;
    animation-delay:0s,1.3s;
  }
  .toast.good{border-color:#3f7a22;color:#c8f2a2;}
  .toast.tip{border-color:#b8862a;color:var(--gold);}
  .scoreline .tipval{color:var(--gold);}
  .toast.bad{border-color:var(--red-dk);color:#ffb3a0;}
  .toast.info{border-color:#b8862e;}
  @keyframes toastin{from{transform:translateY(-14px) scale(.9);opacity:0}}
  @keyframes toastout{to{transform:translateY(-22px);opacity:0}}

  /* ---------- screens ---------- */
  /* Padding, not insets, because the card is a flex child and so it actually
     moves -- unlike #hud, whose children are absolutely positioned. Running
     fullscreen in Telegram this is what keeps the shop and the kitchen editor
     out from under the floating close button. */
  #screen{
    position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#2c4176ee 0%,#151236f7 75%);
    overflow:auto;
    padding:calc(20px + var(--sat)) calc(20px + var(--sar))
            calc(20px + var(--sab)) calc(20px + var(--sal));
  }
  #screen.hidden{display:none;}
  .card{
    width:min(720px,94vw);background:var(--wood-md);border:4px solid var(--wood-dk);
    background:linear-gradient(180deg,#2c4176,#1a2648);border-color:#c9a04a;border-radius:16px;
    box-shadow:inset 0 0 0 3px #14203d, 0 10px 30px rgba(0,0,0,.5);
    padding:22px 26px 24px;text-align:center;
  }
  .card h1{
    font-family:Georgia,'Times New Roman',serif;
    font-size:30px;color:var(--gold);text-shadow:3px 3px 0 #14203d,6px 6px 0 #00000055;
    letter-spacing:2px;margin-bottom:4px;
  }
  .card h2{font-size:15px;color:#ffe7a8;margin-bottom:14px;letter-spacing:1px;}
  .card p{font-size:12px;color:#f3ead6;line-height:1.8;}
  .cols{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:16px 0 6px;text-align:left;}
  .col{flex:1 1 200px;background:#1a2748;border:2px solid #3f5a96;border-radius:10px;padding:10px 12px;}
  .col h3{font-size:11px;color:var(--gold);margin-bottom:7px;letter-spacing:1px;}
  .col ul{list-style:none;font-size:11px;line-height:1.85;color:#f3ead6;}
  .col li b{color:#ffe7a8;}
  kbd{
    background:var(--gold);color:#3a2a1e;border:2px solid #d0841a;padding:0 6px;
    box-shadow:0 2px 0 #d0841a;font:inherit;font-size:10px;
  }
  .big{
    margin-top:18px;background:var(--red);border:4px solid var(--red-dk);color:#fff3e0;
    font:inherit;font-size:17px;letter-spacing:2px;padding:12px 34px;cursor:pointer;
    box-shadow:inset 0 3px 0 #e0694f, 0 5px 0 #5c1f16;
  }
  .big:hover{background:#d4483a;}
  .big:active{transform:translateY(3px);box-shadow:inset 0 3px 0 #e0694f;}
  .big.off,.big:disabled{background:#2a3550;border-color:#1a2240;color:#8a8a9a;
    box-shadow:inset 0 3px 0 #2a3550;cursor:not-allowed;}
  .big.off:active,.big:disabled:active{transform:none;}

  /* ---------- the receipt ---------- */
  .receipt{max-width:420px;margin:14px auto 0;text-align:left;}
  .scoreline.rule{border:none;border-top:3px solid #14203d;margin-top:6px;padding-top:8px;}
  .scoreline.big-line{font-size:17px;color:var(--gold);}
  .scoreline.small{border:none;font-size:10px;color:#c4b48e;justify-content:center;}
  .badval{color:#e8705c;}

  /* ---------- the shop ---------- */
  .card.wide{width:min(860px,96vw);}
  .walletbar{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px;
  }
  .walletbar div{
    background:#1a2748;border:3px solid #14203d;padding:6px 14px;min-width:116px;
  }
  .walletbar span{display:block;font-size:8px;color:#c4b48e;letter-spacing:1px;}
  .walletbar b{font-size:16px;color:var(--gold);}
  .shopscroll{max-height:46vh;overflow-y:auto;text-align:left;padding-right:4px;}
  .shopscroll h3{
    font-size:11px;color:var(--gold);letter-spacing:1px;margin:14px 0 6px;
    border-bottom:2px solid #14203d;padding-bottom:4px;
  }
  .buyrow{
    display:flex;align-items:center;gap:10px;padding:5px 0;
    border-bottom:2px solid #22335e;
  }
  .buyrow.dim{opacity:.55;}
  .buyrow.hired{background:#22335e;padding-left:8px;}
  .buyname{flex:1;font-size:11px;color:#ffe7a8;line-height:1.5;}
  .buyname span{display:block;font-size:9px;color:#c4b48e;}
  .buyname em{display:block;font-size:9px;font-style:normal;color:#e8a05c;}
  .buy{
    flex:0 0 auto;min-width:92px;background:var(--green);border:3px solid #3f7a1e;
    color:#1d2a10;font:inherit;font-size:11px;padding:6px 10px;cursor:pointer;
    box-shadow:inset 0 2px 0 #9ddc68;
  }
  .buy:hover{background:#7fd044;}
  .buy:active{transform:translateY(2px);box-shadow:none;}
  .buy.off{background:#2a3550;border-color:#1a2240;color:#8a8a9a;
    box-shadow:none;cursor:not-allowed;}
  .buy.off:active{transform:none;}

  /* panels fade back when the chef or her station is underneath (game.js) */
  #leftstack,#hint,#fryers,#pad,#tickets,#topbar,#bossHud{transition:opacity .25s;}
  .peek{opacity:.16 !important;}
  .buyname b.heart{color:#ff8ab0;font-size:.85em;}

  /* ---------- the kitchen editor ---------- */
  .trayrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0 10px;}
  .tray{
    background:var(--wood);border:3px solid var(--wood-dk);color:#3a2a1e;
    font:inherit;font-size:10px;padding:5px 9px;cursor:pointer;
    box-shadow:inset 0 2px 0 #c08a4a;
  }
  .tray.on{background:var(--gold);box-shadow:inset 0 2px 0 #ffe7a8,0 0 0 3px #ffd46488;}
  .tray b{color:#3a2a1e;}
  /* The cells are square and there are 19 x 13 of them, so the grid is 1.46
     times as wide as it is tall. Cap the width by the viewport HEIGHT as well
     as the card, or on a short window the kitchen runs off the bottom and you
     are laying out a floor you cannot see. */
  .kgrid{
    display:grid;gap:2px;background:#2a2238;border:3px solid #2a2238;border-radius:8px;padding:2px;
    margin:0 auto;width:min(100%, calc(42vh * 1.462));
    box-shadow:0 4px 0 #14203d,inset 0 0 12px #00000066;
  }
  .kgrid i{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-style:normal;font-size:7px;letter-spacing:0;color:#3a2a1e;
    background:#34508f;overflow:hidden;border-radius:3px;
  }
  /* Painted tiles to match the 3D kitchen: polished marble checker for the
     floor, dressed stone for the walls, and a picture of the real station
     model (rendered by editor.js) standing on its floor tile. */
  .kgrid .void{background:#17142e;box-shadow:inset 0 0 0 1px #221d40;}
  .kgrid .wall{background:linear-gradient(180deg,#bab3aa 0%,#a49d96 48%,#8f8882 52%,#a7a09a 100%);
    box-shadow:inset 0 -2px 0 #6f6862,inset 0 1px 0 #d6d0c6;}
  .kgrid .wall.alt{background:linear-gradient(180deg,#b1aaa2 0%,#9c958f 48%,#888179 52%,#a19a93 100%);}
  .kgrid .floor{background:radial-gradient(circle at 30% 25%,#fbf6ec 0%,#efe6d4 60%,#e3d7bf 100%);}
  .kgrid .floor.alt{background:radial-gradient(circle at 30% 25%,#e9ddc7 0%,#d9c9ac 60%,#cdbb9b 100%);}
  .kgrid i.pic{
    background-color:#efe6d4;background-size:100%;background-position:center;background-repeat:no-repeat;
    box-shadow:inset 0 0 0 1px #00000014;
  }
  .kgrid i.pic.alt{background-color:#dccdb1;}
  .kgrid .spawn{box-shadow:inset 0 0 0 2px #f0a63c,inset 0 0 8px #f0a63c88;}
  .kgrid .st{color:#14203d;font-size:6px;}
  .kgrid .fryer{background:#3a3d46;color:#ffb45c;}
  .kgrid .serve{background:#c9a04a;}
  .kgrid .bin{background:#8a5a33;color:#ffffff;}
  .kgrid .prep{background:#c9d4ec;}
  .kgrid .crate{background:#c8955c;color:#ffffff;}
  .kgrid .stack{background:#ffffff;}
  .kgrid .top-let{background:#6fbf3a;}
  .kgrid .top-tom{background:#d6402f;color:#fff;}
  .kgrid .top-pic{background:#93ad36;}
  .kgrid .sau-may{background:#f6edd3;}
  .kgrid .sau-bbq{background:#7d3417;color:#f3ead6;}
  .kgrid .sau-hot{background:#e0431f;color:#fff;}
  .kgrid .sau-ket{background:#c01f14;color:#fff;}
  .kgrid .lift{cursor:pointer;transition:transform .08s;}
  .kgrid .lift:hover{box-shadow:inset 0 0 0 2px #ffd464,0 0 6px #ffd46499;transform:scale(1.08);position:relative;z-index:1;}
  .kgrid .ok{cursor:pointer;box-shadow:inset 0 0 0 2px #6fbf3a;}
  .kgrid .ok:hover{background:#9fdc6a;}
  .kgrid .no{opacity:.4;}
  .tray{display:inline-flex;align-items:center;gap:5px;}
  .tray .tpic{width:24px;height:24px;background-size:100%;background-position:center;background-repeat:no-repeat;
    background-color:#efe6d4;border-radius:4px;box-shadow:inset 0 0 0 1px #00000022;}
  .khint{font-size:9px;color:#c4b48e;margin-top:8px;}
  .kok{font-size:10px;color:#9fd36a;margin-top:8px;min-height:14px;}
  .kbad{font-size:10px;color:#ffb0a0;margin-top:8px;min-height:14px;}
  .krow{display:flex;gap:8px;justify-content:center;align-items:center;
    flex-wrap:wrap;margin-top:12px;}
  .krow .big{margin-top:0;}

  /* On a phone the reason a thing cannot be bought ("Needs Vented Baskets
     first") is longer than the name beside it, so cap the button or it eats
     the row and the name wraps a word per line. */
  @media (max-width:560px){
    .card.wide{padding:16px 12px 18px;}
    .walletbar div{min-width:96px;padding:5px 10px;}
    .walletbar b{font-size:14px;}
    .shopscroll{max-height:52vh;}
    .buy{min-width:0;max-width:44%;font-size:9px;padding:6px 6px;}
    .buyname{font-size:10px;}
    .buyname span{font-size:8px;}
    .kgrid{width:100%;}
    .kgrid i{font-size:5px;}
  }
  .scoreline{display:flex;justify-content:space-between;font-size:13px;padding:5px 2px;border-bottom:2px dashed #b8862e66;}
  .scoreline span:last-child{color:var(--gold);}
  .rank{font-size:40px;color:var(--gold);text-shadow:3px 3px 0 #14203d;margin:10px 0 2px;}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1d2e;z-index:40;font-size:13px;color:var(--gold);}
  #loading.hidden{display:none;}

  /* ---------------------------------------------------- touch controls ---- */
  #touch{display:none;}
  body.coarse #touch{display:block;}
  #stickZone{
    position:absolute;left:0;bottom:0;width:52%;height:58%;
    pointer-events:auto;touch-action:none;z-index:12;
  }
  #stick{
    position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;
    border:4px solid #14203d;border-radius:50%;
    background:rgba(20,32,61,.42);
    opacity:0;transition:opacity .12s;pointer-events:none;z-index:13;
  }
  #nub{
    position:absolute;left:50%;top:50%;width:52px;height:52px;
    margin:0;border:4px solid #14203d;border-radius:50%;
    background:var(--gold);box-shadow:0 3px 0 rgba(0,0,0,.4);
    transform:translate(-50%,-50%);
  }
  #pad{
    position:absolute;right:12px;
    bottom:14px;
    display:grid;grid-template-columns:auto auto;gap:10px;align-items:end;
    pointer-events:none;z-index:13;
  }
  .tbtn{
    pointer-events:auto;touch-action:none;
    font:inherit;font-size:11px;letter-spacing:1px;color:#fff3e0;
    border:4px solid var(--wood-dk);border-radius:50%;
    background:var(--wood-md);box-shadow:inset 0 3px 0 #3f5a96,0 4px 0 rgba(0,0,0,.45);
    width:64px;height:64px;cursor:pointer;
    /* slightly see-through: the buttons sit over the front counters, and the
       player needs to read what is underneath them */
    opacity:.88;
  }
  .tbtn.down{transform:translateY(3px);box-shadow:inset 0 3px 0 #3f5a96;filter:brightness(1.25);}
  .tbtn.cool{filter:grayscale(.6) brightness(.6);}
  .tbtn.use{width:88px;height:88px;font-size:14px;background:var(--red);
    border-color:var(--red-dk);box-shadow:inset 0 3px 0 #e0694f,0 5px 0 #5c1f16;
    grid-column:2;grid-row:1 / span 2;align-self:center;}
  .tbtn.jump{grid-column:1;grid-row:1;}
  .tbtn.dash{grid-column:1;grid-row:2;background:#3f5a7a;border-color:#22344a;
    box-shadow:inset 0 3px 0 #5f83aa,0 4px 0 rgba(0,0,0,.45);}

  /* ------------------------------------------------- compact phone HUD ----
     Three thin rows at the top (stats, tickets, then held + fryers), and the
     whole bottom third left clear for thumbs. */
  body.mobile #plateview{display:none;}      /* skip the extra render pass */
  body.mobile #moves{display:none;}          /* the buttons show this instead */
  body.mobile #topbar{top:4px;right:4px;gap:3px;}
  body.mobile .stat{min-width:52px;padding:2px 4px;}
  body.mobile .stat .k{font-size:7px;}
  body.mobile .stat .v{font-size:13px;}
  body.mobile #daywrap .v{font-size:11px;}
  body.mobile #daywrap .sub,body.mobile #clockwrap #realClock{display:none;}
  body.mobile #tgtLabel{font-size:7px;}

  /* only the pause button stays on screen; the rest move into the pause card */
  body.mobile #btns{top:4px;left:4px;right:auto;bottom:auto;}
  body.mobile #btnCam, body.mobile #btnMute, body.mobile #btnPix{display:none;}
  body.mobile #btnHelp{font-size:0;padding:7px 12px;border-width:3px;}
  body.mobile #btnHelp::after{content:'\275A\275A';font-size:13px;letter-spacing:1px;}

  /* The hint sits just above the thumb controls; everything else stacks from
     the top, offset by the live ticket-rail height (--ticketH, set in JS). */
  body.mobile #hint{
    top:auto;bottom:184px;
    font-size:9px;padding:4px 9px;max-width:88vw;white-space:normal;text-align:center;
  }
  body.mobile #hint .key{display:none;}

  body.mobile #leftstack{top:calc(56px + var(--ticketH,60px));left:4px;bottom:auto;gap:4px;}
  body.mobile #fryers{top:calc(56px + var(--ticketH,60px));right:4px;bottom:auto;
    flex-direction:column;align-items:flex-end;gap:3px;}

  body.mobile #tickets{left:4px;right:4px;top:52px;gap:4px;flex-wrap:nowrap;}
  body.mobile .ticket{flex:1 1 0;min-width:0;width:auto;border-width:2px;}
  body.mobile .ticket .thead{font-size:8px;padding:2px 3px;gap:3px;}
  body.mobile .ticket .face{width:9px;height:9px;border-width:1px;}
  body.mobile .ticket .tbody{font-size:8px;padding:3px 4px 1px;line-height:1.35;}
  body.mobile .line .bullet{display:none;}
  body.mobile .sub{padding-left:0;font-size:7px;gap:2px 3px;}
  body.mobile .bar{height:5px;}

  body.mobile .fry{min-width:58px;padding:2px 5px;border-width:2px;}
  body.mobile .fry .n{font-size:6px;}
  body.mobile #held{min-width:0;max-width:42vw;padding:4px 7px;border-width:2px;}
  body.mobile #held .k{font-size:6px;}
  body.mobile #held .v{font-size:10px;}
  body.mobile #held .detail{font-size:8px;line-height:1.5;}
  body.mobile #toasts{top:auto;bottom:178px;}
  body.mobile .toast{font-size:10px;padding:4px 9px;border-width:2px;}

  /* ---------------------------------------------- short landscape phones ---
     A phone on its side is ~810x375: wide, but desperately short. The portrait
     rail -- a full-width band of tickets across the top -- costs 23% of the
     height there, straight across the back of the kitchen. Height is the
     scarce axis in landscape and width is the plentiful one, so the rail turns
     ninety degrees: a slim column down the left edge. Same screen area, out of
     the play space. Everything else tightens up around it. */
  @media (max-height:470px){
    body.mobile #hint{display:none;}

    body.mobile #tickets{
      left:4px; right:auto; top:40px; bottom:4px;
      width:var(--railW);
      flex-direction:column; flex-wrap:wrap; align-content:flex-start;
      gap:4px;
    }
    /* Tickets size to their own content and stack downwards; if a busy day
       overflows the column, flex-wrap starts a second one beside it rather
       than clipping the fourth order off the bottom. */
    body.mobile .ticket{flex:0 0 auto;width:var(--railW);}
    body.mobile .ticket .thead{font-size:7px;padding:2px 3px;}
    body.mobile .ticket .face{width:8px;height:8px;}
    body.mobile .ticket .tbody{font-size:7px;padding:2px 4px 1px;line-height:1.3;}
    body.mobile .sub{font-size:6px;gap:1px 3px;}
    body.mobile .sw{width:6px;height:6px;}
    body.mobile .bar{height:4px;margin-top:3px;}

    /* the held card moves out from under the old rail to the bottom, between
       the ticket column and the thumb buttons */
    body.mobile #leftstack{
      top:auto; bottom:6px;
      left:calc(var(--railW) + 10px);
    }
    body.mobile #held{max-width:30vw;}
    body.mobile #fryers{top:40px;}
    body.mobile #toasts{top:auto;bottom:96px;}

    .tbtn{width:56px;height:56px;font-size:9px;}
    .tbtn.use{width:76px;height:76px;font-size:12px;}
    #stick{width:98px;height:98px;margin:-49px 0 0 -49px;}
    #nub{width:42px;height:42px;}
    /* start the drag zone clear of the ticket column, so the floating stick
       never springs up underneath an order */
    body.mobile #stickZone{left:var(--railW);width:calc(52% - var(--railW) + 90px);}
  }

  /* Cards must scroll on a phone rather than overflow off-screen. */
  body.mobile .card{padding:14px 14px 16px;}
  body.mobile .card h1{font-size:20px;}
  body.mobile .card h2{font-size:11px;}
  body.mobile .card p{font-size:10px;line-height:1.6;}
  body.mobile .col{padding:7px 9px;flex:1 1 100%;}
  body.mobile .col h3{font-size:9px;}
  body.mobile .col ul{font-size:9px;line-height:1.6;}
  body.mobile .big{font-size:14px;padding:10px 22px;margin-top:12px;}
  body.mobile .scoreline{font-size:11px;}
  body.mobile .rank{font-size:28px;}

  /* Narrow windows: shrink the rail rather than letting it eat the kitchen. */
  @media (max-width:1180px){
    .ticket{width:158px;}
    .ticket .tbody{font-size:10px;padding:5px 6px 2px 6px;}
    .ticket .thead{font-size:9px;}
    .sub{font-size:9px;}
    #tickets{right:212px;gap:6px;}
    .stat{min-width:78px;}
    .stat .v{font-size:16px;}
  }

  /* ---------- the castle bosses ---------- */
  /* A boss's card sits low over a clear backdrop, so the boss stays in view. */
  #screen.cine{
    align-items:flex-end;
    background:linear-gradient(0deg,#151236f2 0%,#15123699 38%,#15123600 68%);
  }
  .card.bosscard{
    width:min(780px,96vw);max-height:58vh;overflow-y:auto;
    background:linear-gradient(180deg,#2c1a3ef0,#150d24f5);border-color:#e0b04a;
  }
  .card.bosscard h1{font-size:34px;}
  .bossflag{
    display:inline-block;font-size:11px;letter-spacing:3px;color:#1a1020;
    background:var(--boss,var(--gold));padding:3px 14px;border-radius:999px;margin-bottom:8px;
    box-shadow:0 0 18px var(--boss,var(--gold));
  }
  .story{margin:4px 0 2px;}
  .story p{text-align:left;font-style:italic;color:#e8dcc4;margin-bottom:6px;}
  .trophy{border:2px solid #e0b04a;border-radius:10px;padding:8px 12px;background:#2a1e10;margin:10px 0;text-align:left;}
  .trophy h3{font-size:12px;color:var(--gold);margin-bottom:4px;letter-spacing:1px;}
  .nextboss{color:#e6c27a;}
  .ticket.boss{border-color:#e0b04a;box-shadow:0 0 0 2px #e0b04a77,0 4px 0 rgba(0,0,0,.4);}
  .ticket.boss .thead{background:linear-gradient(90deg,#5a1a6a,#8a2a2e);}

  /* The boss's panel, bottom right: a clear window the boss cam is drawn
     into (see renderBossCam in game.js), and the hunger meter under it. */
  #bossHud{position:absolute;right:12px;bottom:12px;width:min(270px,34vw);text-align:center;}
  #bossHud.hidden{display:none;}
  #bossHud .bcam{
    height:150px;border:3px solid #c9a04a;border-bottom:0;border-radius:10px 10px 0 0;
    box-shadow:inset 0 0 0 2px #14203d,inset 0 -30px 30px -20px #00000088;
  }
  #bossHud .binfo{border-radius:0 0 10px 10px;padding:6px 10px 7px;}
  #bossHud .bname{font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:4px;}
  #bossHud .bmeter{height:13px;background:#1a1020;border:2px solid #e0b04a;border-radius:7px;overflow:hidden;}
  #bossHud .bmeter i{display:block;height:100%;width:0;transition:width .45s ease-out;
    background:linear-gradient(90deg,var(--boss,#c8402e),#ffe27a);}
  #bossHud .bcount{font-size:10px;margin-top:3px;color:#ffe7a8;}
  #bossHud.fed{animation:bossfed .5s ease-out;}
  #bossHud.angry{animation:bossangry .6s ease-out;}
  @keyframes bossfed{40%{transform:scale(1.06);}}
  @keyframes bossangry{
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-5px);}
  }
  body.mobile #bossHud{right:auto;bottom:auto;left:50%;transform:translateX(-50%);top:calc(56px + var(--ticketH,60px));width:36vw;}
  body.mobile #bossHud .bcam{height:58px;border-width:2px;}
  body.mobile #bossHud .binfo{padding:2px 5px 3px;border-width:2px;}
  body.mobile #bossHud.fed,body.mobile #bossHud.angry{animation:none;}
  body.mobile #bossHud .bname{font-size:7px;letter-spacing:1px;margin-bottom:2px;}
  body.mobile #bossHud .bmeter{height:8px;}
  body.mobile #bossHud .bcount{font-size:7px;}
  body.mobile .card.bosscard{max-height:62vh;}
  body.mobile .card.bosscard h1{font-size:20px;}
  body.mobile .story p{font-size:9px;line-height:1.5;}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="topbar">
    <div class="panel stat" id="daywrap">
      <div class="k">Day</div><div class="v" id="day">1</div>
      <div class="sub" id="dayName">Opening Day</div>
    </div>
    <div class="panel stat" id="clockwrap"><div class="k">Shift</div><div class="v" id="clock">2:00</div>
      <div class="sub" id="realClock"></div></div>
    <div class="panel stat" id="scorewrap">
      <div class="k">Till</div><div class="v gold" id="score">$0.00</div>
      <div class="tgt" id="tgtBar"><i></i></div>
      <div id="tgtLabel">rent $18.00</div>
    </div>
    <div class="panel stat"><div class="k">Combo</div><div class="v" id="combo">x1</div></div>
    <div class="panel stat" id="chefwrap">
      <div class="k">Chef</div><div class="v" id="chefLv">Lv 1</div>
      <div class="tgt xp" id="xpBar"><i></i></div>
    </div>
  </div>

  <div id="tickets"></div>

  <div id="leftstack">
    <div class="panel hidden" id="plateview"></div>
    <div class="panel" id="held">
      <div class="k">In Wings</div>
      <div class="v" id="heldName">Nothing</div>
      <div class="detail" id="heldDetail"></div>
    </div>
    <div class="panel" id="moves">
      <div class="mv"><div class="k">Dash &#183; Shift</div><div class="m ready" id="dashBar"><i></i></div></div>
      <div class="mv"><div class="k">Flap &#183; Space</div><div class="pips" id="flapPips"></div></div>
      <div class="mv hidden" id="powerWrap"><div class="k">Frenzy &#183; Q</div><div class="m" id="powerBar"><i></i></div></div>
    </div>
  </div>

  <div id="fryers" class="hidden"></div>

  <div class="panel" id="hint"><span class="key">E</span><span id="hintText">&#8212;</span></div>

  <div id="btns">
    <button class="btn" id="btnCam">VIEW: CLOSE</button>
    <button class="btn" id="btnMute">SOUND: ON</button>
    <button class="btn" id="btnPix">PIXEL: 1X</button>
    <button class="btn" id="btnHelp">?</button>
  </div>

  <div id="toasts"></div>

  <div id="touch">
    <div id="stickZone"><div id="stick"><div id="nub"></div></div></div>
    <div id="pad">
      <button class="tbtn jump" id="tJump">JUMP</button>
      <button class="tbtn dash" id="tDash">DASH</button>
      <button class="tbtn use" id="tUse">USE</button>
      <button class="tbtn power hidden" id="tPower">POWER</button>
    </div>
  </div>
</div>

<div id="screen"></div>
<div id="loading">HEATING THE FRYERS…</div>

<script src="./vendor/three.min.js"></script>
<script src="./src/platform.js"></script>
<script src="./src/config.js"></script>
<script src="./src/season.js"></script>
<script src="./src/daylight.js"></script>
<script src="./src/layout.js"></script>
<script src="./src/economy.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/textures.js"></script>
<script src="./src/models.js"></script>
<script src="./src/mirror.js"></script>
<script src="./src/dining.js"></script>
<script src="./src/world.js"></script>
<script src="./src/interact.js"></script>
<script src="./src/orders.js"></script>
<script src="./src/grounds.js"></script>
<script src="./src/staff.js"></script>
<script src="./src/bosses.js"></script>
<script src="./src/ui.js"></script>
<script src="./src/shop.js"></script>
<script src="./src/editor.js"></script>
<script src="./src/touch.js"></script>
<script src="./src/game.js"></script>
<script>
// Safety net: if a hardened browser refuses to load the local script files,
// say so plainly instead of sitting on the loading screen forever.
window.addEventListener('load', function () {
  if (typeof THREE === 'undefined' || !window.CS || !window.CS.game) {
    var l = document.getElementById('loading');
    l.classList.remove('hidden');
    l.innerHTML = '<div style="max-width:560px;text-align:center;line-height:2.1">' +
      'YOUR BROWSER BLOCKED THE LOCAL SCRIPT FILES.<br><br>' +
      'Open <b>ChickenSandy-standalone.html</b> instead &#8212;<br>' +
      'the same game in one self-contained file.</div>';
  }
});
</script>
</body>
</html>
